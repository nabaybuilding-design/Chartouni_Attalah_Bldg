<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chartouni_Attalah_Building - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <h1>Chartouni_Attalah_Building</h1>
      <p>
        Local test version. Login uses the Owner Email and Password from the Apartments table.
      </p>

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="Enter email" />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password" />
      </div>

      <button class="btn-primary" id="loginBtn">Login</button>
      <div id="loginMessage" class="error"></div>

      <div class="card mt-16">
        <div><strong>Dummy admin</strong></div>
        <div class="muted">Email: admin@chartouniattalah.com</div>
        <div class="muted">Password: admin123</div>

        <hr class="sep" />

        <div><strong>Dummy user</strong></div>
        <div class="muted">Email: user101@chartouniattalah.com</div>
        <div class="muted">Password: user123</div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
