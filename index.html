<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chartouni_Attalah_Building - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <h1>Chartouni_Attalah_Building</h1>
      <p>Please log in to continue.</p>

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="Enter email" />
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter password" />
      </div>

      <button type="button" class="btn-primary" id="loginBtn">Login</button>
      <div id="loginMessage" class="error"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js?v=5"></script>
  <script src="js/supabaseClient.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
</body>
</html>
